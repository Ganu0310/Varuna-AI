# VARUNA local development stack — 03_ARCHITECTURE §3.9.
#
# `docker compose up` on a clean machine must reach a working system using only the
# variables in .env.example (release criterion — 01_PRD §12.7).
#
#   Datastores + support services always start.
#   App services (api, worker, web, ml) build from source.
#
# For the common inner-loop, run the datastores here and the app services on the host
# with `pnpm dev` / `uvicorn --reload`.

name: varuna

services:
  mongo:
    image: mongo:7
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports: ['27017:27017']
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongo-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    restart: 'no'
    entrypoint:
      - bash
      - -c
      - |
        mongosh --host mongo:27017 --quiet --eval '
          try { rs.status().ok } catch (e) {
            rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "mongo:27017" }] });
          }'

  redis:
    image: redis:7-alpine
    # BullMQ requires noeviction — some managed free tiers default to an eviction policy
    # and will silently lose jobs (11_API_KEYS A10).
    command: ['redis-server', '--maxmemory-policy', 'noeviction', '--appendonly', 'yes']
    ports: ['6379:6379']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 10

  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    restart: 'no'
    entrypoint:
      - sh
      - -c
      - |
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/varuna &&
        mc anonymous set download local/varuna || true

  titiler:
    image: ghcr.io/developmentseed/titiler:latest
    environment:
      # Serves XYZ/WMTS tiles directly from COGs in object storage (03_ARCHITECTURE §3.7.2)
      TITILER_API_CORS_ORIGINS: '*'
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_S3_ENDPOINT: http://minio:9000
      AWS_VIRTUAL_HOSTING: 'FALSE'
    # the official titiler image serves on port 80 inside the container, not 8000
    ports: ['8001:80']
    depends_on:
      minio:
        condition: service_healthy

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.19.0
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
    ports: ['5000:5000']
    volumes:
      - mlflow-data:/mlflow

  ml:
    build:
      context: ./services/ml
    environment:
      ML_SERVICE_TOKEN: ${ML_SERVICE_TOKEN:-dev-service-token}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET: varuna
      TITILER_URL: http://titiler:8000
    ports: ['8000:8000']
    depends_on:
      minio:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/?replicaSet=rs0
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      ML_SERVICE_URL: http://ml:8000
      TITILER_URL: http://titiler:8001
    ports: ['4000:4000']
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ['node', 'apps/worker/dist/index.js']
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/?replicaSet=rs0
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      ML_SERVICE_URL: http://ml:8000
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports: ['5173:80']
    depends_on:
      - api

volumes:
  mongo-data:
  redis-data:
  minio-data:
  mlflow-data:
