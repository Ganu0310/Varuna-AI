name: CI

# Pipeline order — 03_ARCHITECTURE §3.10:
#   lint → typecheck → unit → geodesy known-answer → real-data policy → secret scan
#   → build images → integration (Testcontainers) → E2E (Playwright) → [model eval gate] → deploy
# Stages beyond unit/policy are added as the phases that need them land.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node — lint · typecheck · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      # @varuna/shared and @varuna/api are resolved via package.json main/exports
      # (./dist and ./src/* -> ./dist/*), which is gitignored build output — not TS
      # project references to source. apps/api and apps/web import @varuna/shared;
      # apps/worker imports @varuna/api's dist through the ./src/* subpath export.
      # Nothing past this line typechecks without both built, in this order.
      - run: pnpm --filter @varuna/shared build
      - run: pnpm --filter @varuna/api build
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm check:tokens
      - run: pnpm check:openapi
      - run: pnpm check:bundle

  integration:
    name: Integration — API against a real MongoDB
    runs-on: ubuntu-latest
    services:
      mongo:
        # Standalone is enough for the Phase 1 suite (time-series + 2dsphere semantics).
        # A replica set is only required once we use multi-document transactions.
        image: mongo:8
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 10s --health-timeout 5s --health-retries 10
      # enqueue() (apps/api/src/queue/producer.ts) is a real BullMQ queue, not an in-memory
      # stub — every job-creating route needs this to respond. Without it, `queue.getJob`/
      # `queue.add` hang until vitest's testTimeout, surfacing as an unrelated-looking
      # "Test timed out in 30000ms" on whichever job-creating test happens to run.
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      MONGODB_URI_TEST: mongodb://localhost:27017
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm --filter @varuna/shared build
      - run: pnpm --filter @varuna/api test:integration

  real-data-policy:
    name: Real-data policy (required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/check-real-data-policy.mjs

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          # Required since gitleaks-action's breaking update: a pull_request run fetches the
          # diff via the GitHub API, which needs an authenticated token even for a public repo.
          # https://github.com/gitleaks/gitleaks-action#-announcement
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  python:
    name: Python — ruff · pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: black --check .
      - run: pytest -q
