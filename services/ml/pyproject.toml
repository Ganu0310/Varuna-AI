[project]
name = "varuna-ml"
version = "0.1.0"
description = "VARUNA ML/geospatial service — SAR preprocessing, segmentation, drift back-tracking, attribution scoring (SIH26143)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "httpx>=0.27.0",
  "python-multipart>=0.0.12",
  # Geodesy — Phase 1 (known-answer suite must agree with the Node/GeographicLib stack
  # within 0.1%; pyproj.Geod uses the same GeographicLib algorithm). 02_TRD §2.6.4.
  "numpy>=1.26",
  "pyproj>=3.6",
  "shapely>=2.0",
  # Raster I/O + COG writing for the ingest/segment/detect routers (varuna_ml.ingest,
  # varuna_ml.routers.ingest/segment). rasterio manylinux wheels vendor GDAL/PROJ/GEOS.
  "rasterio>=1.3",
  "rio-cogeo>=5.3",
  # S3 access for reading/writing scene COGs in object storage (varuna_ml.ingest.preprocess,
  # varuna_ml.routers.ingest/segment). botocore is pulled in transitively.
  "boto3>=1.35",
  # Classical dark-spot detector: adaptive thresholding + connected components + morphology
  # (varuna_ml.detect.darkspot). Imported at service start-up via the /segment router.
  "scipy>=1.11",
  "scikit-image>=0.22",
  # Model/eval manifest parsing (varuna_ml.models.manifest).
  "pyyaml>=6.0",
  # OPeNDAP access for the keyless HYCOM currents attempt in the drift degradation ladder
  # (varuna_ml.drift.forcing). Without these the /backtrack endpoint raises ModuleNotFound
  # instead of degrading cleanly to FOOTPRINT_PROXIMITY for dates outside HYCOM coverage.
  "netCDF4>=1.6",
  "cftime>=1.6",
  # Reads a local ERA5 GRIB/NetCDF file (ERA5_LOCAL_PATH) in the same drift degradation
  # ladder (varuna_ml.drift.forcing._fetch_era5_local). Without this the local-file path
  # raises ModuleNotFound instead of either reading the file or degrading cleanly.
  "xarray>=2024.1",
]

# Heavier scientific/ML dependencies land with the phases that need them (see
# IMPLEMENTATION_PLAN.md §14.6):
#   Phase 4/5: opencv-python-headless, geopandas,
#              torch, torchvision, segmentation-models-pytorch, transformers, mlflow
#   Phase 7:   copernicusmarine, cdsapi, opendrift
[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
  "black>=24.10.0",
  "mypy>=1.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["varuna_ml"]
