[project]
name = "varuna-ml"
version = "0.1.0"
description = "VARUNA ML/geospatial service — SAR preprocessing, segmentation, drift back-tracking, attribution scoring (SIH26143)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "httpx>=0.27.0",
  "python-multipart>=0.0.12",
  # Geodesy — Phase 1 (known-answer suite must agree with the Node/GeographicLib stack
  # within 0.1%; pyproj.Geod uses the same GeographicLib algorithm). 02_TRD §2.6.4.
  "numpy>=1.26",
  "pyproj>=3.6",
  "shapely>=2.0",
]

# Heavier scientific/ML dependencies land with the phases that need them (see
# IMPLEMENTATION_PLAN.md §14.6):
#   Phase 4/5: rasterio, rio-cogeo, opencv-python-headless, geopandas,
#              torch, torchvision, segmentation-models-pytorch, transformers, mlflow
#   Phase 7:   xarray, netCDF4, copernicusmarine, cdsapi, opendrift, scipy
[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
  "black>=24.10.0",
  "mypy>=1.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["varuna_ml"]
