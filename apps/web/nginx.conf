server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback — the workspace is an authenticated single-page app (03_ARCHITECTURE ADR-011).
  location / {
    try_files $uri $uri/ /index.html;
  }

  # API + WebSocket + tiles are proxied by the platform load balancer in deployment;
  # in local docker-compose the browser hits the api service directly on :4000.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
