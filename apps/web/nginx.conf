server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # ── Security headers ────────────────────────────────────────────────────────
  # These belong HERE, not only on the API. Helmet protects API responses, but those are
  # JSON: a CSP on a JSON payload stops almost nothing. The document that actually executes
  # script in the analyst's browser is this one, and until these were added it was served
  # with no policy at all.
  #
  # `always` matters — without it nginx omits the header on error responses, which is
  # precisely where an injected payload would be reflected.

  # MapLibre GL compiles its renderer into a blob: worker and injects style rules at runtime,
  # so worker-src must allow blob: and style-src must allow inline. Script stays locked to
  # 'self': no CDN, no inline script, no eval.
  #
  # connect-src is 'self' plus the API and tile origins. In docker-compose the browser talks
  # to the API on another port, which is a different origin to the CSP even though it is the
  # same host, so it has to be named explicitly or every fetch is blocked.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; worker-src 'self' blob:; child-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' http://localhost:4000 ws://localhost:4000 http://localhost:8001; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

  # Clickjacking. `frame-ancestors` above supersedes this for modern browsers; kept for older
  # ones, since an investigation workspace framed by a third party would let an attacker
  # overlay a "confirm" control on a review action.
  add_header X-Frame-Options "DENY" always;

  # Stops a browser guessing a content type — an uploaded file echoed back must never be
  # sniffed into executable script.
  add_header X-Content-Type-Options "nosniff" always;

  # Investigation IDs live in the URL path. Without this they would leak to any external host
  # the page links to via the Referer header.
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # No use for these capabilities; denying them removes the prompt as an attack surface.
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;

  # SPA fallback — the workspace is an authenticated single-page app (03_ARCHITECTURE ADR-011).
  location / {
    try_files $uri $uri/ /index.html;
  }

  # API + WebSocket + tiles are proxied by the platform load balancer in deployment;
  # in local docker-compose the browser hits the api service directly on :4000.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";

    # `add_header` does NOT inherit into a location block that declares its own — nginx
    # replaces the inherited set rather than merging it. Without these repeated here, every
    # bundle would be served with no security headers at all.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; worker-src 'self' blob:; child-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' http://localhost:4000 ws://localhost:4000 http://localhost:8001; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
  }
}
